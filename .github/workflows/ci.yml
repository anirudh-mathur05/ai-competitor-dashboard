name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint Python files
        run: |
          python -m py_compile $(git ls-files '*.py') || exit 1

      - name: Validate Streamlit App Loads
        run: |
          python - << 'PYEOF'
import app
print("Streamlit app imported successfully.")
PYEOF

      - name: Validate Backend Imports (if backend folder exists)
        run: |
          if [ -d "backend" ]; then
            python - << 'PYEOF'
import backend.analyzer
import backend.llm_client
import backend.main
print("Backend imported successfully.")
PYEOF
          else
            echo "No backend folder found — skipping backend tests."
          fi
