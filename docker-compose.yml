version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: competitor-backend
    ports:
      - "8000:8000"
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: competitor-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
