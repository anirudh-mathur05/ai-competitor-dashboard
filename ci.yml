name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint Python files
        run: |
          python -m py_compile $(git ls-files "*.py") || exit 1

      - name: Validate Streamlit App Loads
        run: |
          python -c "import app; print('Streamlit app imported successfully.')"

      - name: Validate Backend Imports
        run: |
          if [ -d "backend" ]; then
            echo "import backend.analyzer" > test_backend.py
            echo "import backend.llm_client" >> test_backend.py
            echo "import backend.main" >> test_backend.py
            echo "print('Backend imported successfully.')" >> test_backend.py
            python test_backend.py
          else
            echo "No backend folder found — skipping backend tests."
          fi
